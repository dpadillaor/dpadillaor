name: Generate snake animation

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake from contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#ff5a1f&color_dots=#ebedf0,#ffd2c0,#ff9a72,#ff5a1f,#c23d0c
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff5a1f&color_dots=#161b22,#5a2410,#a63c14,#ff5a1f,#ffb08f

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
